<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎂</text></svg>">
<title>Happy Birthday, Nisha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=JetBrains+Mono:wght@400;600;800&display=swap">
<style>
/* Layout: one centred stage — a code comment above, the cake in the middle, the wish below; deliberate single dark theme */
:root {
  --bg: #0d1117;
  --panel: #151b23;
  --line: #2a3442;
  --fg: #dfe6ee;
  --muted: #8592a3;
  --accent: #ffb454;
  --green: #8fd16b;
  --pink: #f0718a;
  --blue: #6cb6ff;
  --violet: #c39bff;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--mono); font-size: 14px; line-height: 1.55; }
.wrap {
  max-width: 560px; margin: 0 auto;
  padding-block: 32px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; align-items: center; gap: 18px; text-align: center;
}
.comment { color: var(--muted); font-size: 13px; margin: 0; }
h1 { font-family: var(--display); font-weight: 800; font-size: clamp(30px, 8vw, 46px); line-height: 1.05; margin: 0; text-wrap: balance; }
h1 .name { color: var(--accent); }
.hint { color: var(--muted); margin: 0; }

.cake-stage { display: grid; place-items: center; padding-block: 16px 4px; width: 100%; }
.cake { position: relative; width: min(280px, 100%); height: 250px; }
.candles { position: absolute; left: 0; right: 0; top: 0; height: 92px; display: flex; justify-content: center; gap: 22px; z-index: 2; }
.candle {
  position: relative; width: 14px; height: 60px; margin-top: 32px; border: 0; padding: 0; cursor: pointer;
  background: repeating-linear-gradient(-45deg, var(--blue) 0 6px, var(--fg) 6px 12px); border-radius: 3px;
}
.candle::before { content: ""; position: absolute; left: 6px; top: -8px; width: 2px; height: 8px; background: #555; }
.candle:focus-visible, button:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }
.flame {
  position: absolute; left: 50%; top: -34px; width: 14px; height: 24px; transform: translateX(-50%);
  background: radial-gradient(ellipse at 50% 70%, #fff7c2 0 20%, var(--accent) 45%, #ff6b3d 75%, transparent 76%);
  border-radius: 50% 50% 45% 45%; animation: flick .18s ease-in-out infinite alternate; transform-origin: 50% 100%;
}
.candle.out .flame { display: none; }
.candle.out::after {
  content: ""; position: absolute; left: 4px; top: -30px; width: 6px; height: 20px; border-radius: 50%;
  background: color-mix(in srgb, var(--muted) 50%, transparent); filter: blur(3px); animation: smoke 1.4s ease-out forwards;
}
@keyframes flick { to { transform: translateX(-50%) scale(1.06, .92) rotate(3deg); } }
@keyframes smoke { to { transform: translateY(-26px); opacity: 0; } }
.tier { position: absolute; left: 50%; transform: translateX(-50%); border-radius: 10px; }
.tier.top { top: 92px; width: 70%; height: 62px; background: var(--pink); }
.tier.top::before {
  content: ""; position: absolute; left: 0; right: 0; top: 0; height: 18px; border-radius: 10px 10px 0 0;
  background: radial-gradient(circle at 10px 14px, var(--fg) 9px, transparent 10px) 0 0 / 20px 22px repeat-x, var(--fg);
  clip-path: inset(0 0 -8px 0);
}
.tier.bottom { top: 152px; width: 100%; height: 82px; background: var(--violet); }
.tier.bottom::after { content: "</>"; position: absolute; inset: 0; display: grid; place-items: center; font-weight: 800; font-size: 26px; color: #2a1747; }
.plate { position: absolute; left: 50%; transform: translateX(-50%); bottom: 4px; width: 116%; max-width: 330px; height: 14px; border-radius: 50%; background: var(--line); }

.photo { position: fixed; inset: 0; z-index: 40; background: var(--bg); overflow: hidden; animation: pop .7s ease-out; }
.photo-bg { position: absolute; inset: -40px; background-size: cover; background-position: center; filter: blur(28px) brightness(.55); }
.photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; object-position: 50% 0; }
.photo .reveal {
  position: absolute; left: 50%; transform: translateX(-50%);
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  width: min(560px, calc(100% - 32px));
  background: color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  max-height: 45%; overflow-y: auto;
}
@keyframes pop { from { opacity: 0; transform: scale(1.04); } }
.reveal {
  width: 100%; text-align: left;
  border: 1px solid var(--accent); background: color-mix(in srgb, var(--accent) 9%, var(--panel));
  border-radius: 10px; padding: 16px 18px;
}
.reveal strong { font-family: var(--display); font-size: 20px; display: block; margin-bottom: 4px; color: var(--accent); }
.reveal .from { color: var(--muted); display: block; margin-top: 8px; }
.btn {
  font: inherit; font-weight: 600; font-size: 13px; cursor: pointer; margin-top: 12px;
  background: transparent; color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 9px 14px;
}
#confetti { position: fixed; inset: 0; pointer-events: none; z-index: 50; width: 100%; height: 100%; }
@media (max-width: 400px) { .candles { gap: 14px; } }
@media (prefers-reduced-motion: reduce) { .flame { animation: none; } }
</style>
<link rel="preload" as="image" href="nisha.jpg">

</head>
<body>
<canvas id="confetti" aria-hidden="true"></canvas>

<main class="wrap">
  <h1>Happy Birthday, <span class="name" id="name">Nisha</span></h1>
  <p class="hint">Make a wish, then tap each candle to blow it out.</p>

  <div class="cake-stage" id="stage">
    <div class="cake">
      <div class="candles" id="candles"></div>
      <div class="tier top"></div>
      <div class="tier bottom"></div>
      <div class="plate"></div>
    </div>
  </div>

  <div class="photo" id="photo-wrap" hidden>
    <div class="photo-bg" id="photo-bg"></div>
    <img id="photo" alt="Nisha">
    <div class="reveal" id="msg">
      <strong id="msg-title">Happy Birthday, Nisha</strong>
      <span id="wish"></span>
    </div>
  </div>
</main>

<script>
/* ===== Edit these to personalise ===== */
const NAME = "Nisha";
const PHOTO = "nisha.jpg";
const FROM = "your friend";
const WISH = "Happy birthday! May your builds (prayers) always pass, your bugs (difficulties) be easy to find, and this year bring you everything you've been working toward.";
const CANDLES = 5;
/* ===================================== */

const $ = (id) => document.getElementById(id);
const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
$("name").textContent = NAME;

const cv = $("confetti"), cx = cv.getContext("2d");
let parts = [], raf = null;
function resize() { cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio; }
addEventListener("resize", resize); resize();
function confetti(n = 160) {
  if (reduce) return;
  const cols = ["#ffb454", "#8fd16b", "#f0718a", "#6cb6ff", "#c39bff", "#dfe6ee"];
  for (let i = 0; i < n; i++) parts.push({
    x: Math.random() * cv.width, y: -20 * devicePixelRatio - Math.random() * 300,
    vx: (Math.random() - .5) * 3, vy: 2 + Math.random() * 4,
    r: (4 + Math.random() * 5) * devicePixelRatio, a: Math.random() * 6, va: (Math.random() - .5) * .3,
    c: cols[i % cols.length]
  });
  if (!raf) tick();
}
function tick() {
  cx.clearRect(0, 0, cv.width, cv.height);
  parts.forEach((p) => {
    p.x += p.vx * devicePixelRatio; p.y += p.vy * devicePixelRatio; p.a += p.va; p.vy += .03;
    cx.save(); cx.translate(p.x, p.y); cx.rotate(p.a); cx.fillStyle = p.c;
    cx.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); cx.restore();
  });
  parts = parts.filter((p) => p.y < cv.height + 40);
  raf = parts.length ? requestAnimationFrame(tick) : (cx.clearRect(0, 0, cv.width, cv.height), null);
}

function build() {
  const wrap = $("candles"); wrap.innerHTML = "";
  for (let i = 0; i < CANDLES; i++) {
    const c = document.createElement("button");
    c.className = "candle"; c.id = "candle-" + i;
    c.setAttribute("aria-label", "Blow out candle " + (i + 1));
    c.innerHTML = '<span class="flame"></span>';
    c.addEventListener("click", () => {
      if (c.classList.contains("out")) return;
      c.classList.add("out"); update();
    });
    wrap.appendChild(c);
  }
  $("photo-wrap").hidden = true;
  $("stage").hidden = false;
  document.querySelector(".hint").hidden = false;
  document.body.style.overflow = "";
  update();
}
function update() {
  const left = document.querySelectorAll(".candle:not(.out)").length;
  if (!left) {
    $("stage").hidden = true;
    document.querySelector(".hint").hidden = true;
    $("photo").src = PHOTO;
    $("photo-bg").style.backgroundImage = `url(${PHOTO})`;
    $("msg-title").textContent = `Happy Birthday, ${NAME}`;
    $("photo-wrap").hidden = false;
    document.body.style.overflow = "hidden";
    $("wish").textContent = WISH;
    confetti();
  }
}
build();
</script>

</body>
</html>
